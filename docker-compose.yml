version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: map-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: map-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: map-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./config/elasticsearch/mappings.json:/usr/share/elasticsearch/config/mappings.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  routing-service:
    build:
      context: ./services/routing-service
    container_name: map-routing
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: ${ROUTING_SERVICE_PORT:-8081}
      POSTGRES_DSN: ${POSTGRES_DSN:?Copy .env.example to .env first}
      REDIS_ADDR: ${REDIS_INTERNAL_ADDR:?Copy .env.example to .env first}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  geocoding-service:
    build:
      context: ./services/geocoding-service
    container_name: map-geocoding
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_INTERNAL_URL:?Copy .env.example to .env first}
    depends_on:
      elasticsearch:
        condition: service_healthy

  tile-service:
    build:
      context: ./services/tile-service
    container_name: map-tiles
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: ${TILE_SERVICE_PORT:-8082}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  elasticsearch_data:
