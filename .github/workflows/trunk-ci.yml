name: Trunk CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trunk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-coverage:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f docker-compose.test.yml config --quiet
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -e "services/geocoding-service[test]"
      - name: Vet Go services
        run: |
          cd services/routing-service && go vet ./...
          cd ../tile-service && go vet ./...
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l services/routing-service services/tile-service)"
      - name: Check source copyright headers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            grep -q 'Copyright (c) 2026 Ravi Sharma' "$file"
          done < <(find config scripts services tests -type f \( -name '*.go' -o -name '*.py' -o -name '*.sh' -o -name '*.sql' -o -name '*.ts' \) -not -path '*/__pycache__/*' -not -path '*/node_modules/*')
      - name: Run unit tests with parallel workers & isolated doubles
        run: make test-unit
      - name: Enforce >=80% Code Coverage Threshold
        run: make test-coverage

  integration-tests:
    name: Integration Tests (Ephemeral Containers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e "services/geocoding-service[test]"
      - name: Run Integration Tests with Ephemeral Containers
        run: make test-integration

  e2e-tests:
    name: E2E Playwright Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -e "services/geocoding-service"
      - name: Install Playwright and Browser Binaries
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E Tests
        run: make test-e2e
      - name: Upload E2E Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 14

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error .

  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const additions = context.payload.pull_request.additions;
            const deletions = context.payload.pull_request.deletions;
            const changes = additions + deletions;
            const label = changes > 1500 ? 'size/XL' : changes > 750 ? 'size/L' : changes > 250 ? 'size/M' : 'size/S';
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const existing of labels.filter(item => item.name.startsWith('size/'))) {
              await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, name: existing.name });
            }
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: [label] });
            if (changes > 1500) core.warning(`PR changes ${changes} lines; consider splitting it into smaller trunk-based changes when practical.`);
