name: Trunk CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trunk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Test routing service
        working-directory: services/routing-service
        run: go test ./...
      - name: Vet routing service
        working-directory: services/routing-service
        run: go vet ./...
      - name: Test tile service
        working-directory: services/tile-service
        run: go test ./...
      - name: Vet tile service
        working-directory: services/tile-service
        run: go vet ./...
      - name: Compile geocoding service
        run: python -m compileall services/geocoding-service/app
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l services/routing-service services/tile-service)"
      - name: Check source copyright headers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            grep -q 'Copyright (c) 2026 Ravi Sharma' "$file"
          done < <(find config scripts services -type f \( -name '*.go' -o -name '*.py' -o -name '*.sh' -o -name '*.sql' \) -not -path '*/__pycache__/*')

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error .

  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b # v9.0.0
        with:
          script: |
            const additions = context.payload.pull_request.additions;
            const deletions = context.payload.pull_request.deletions;
            const changes = additions + deletions;
            const label = changes > 300 ? 'size/XL' : changes > 150 ? 'size/L' : changes > 50 ? 'size/M' : 'size/S';
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const existing of labels.filter(item => item.name.startsWith('size/'))) {
              await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, name: existing.name });
            }
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: [label] });
            if (changes > 300) core.warning(`PR changes ${changes} lines; split it into smaller trunk-based changes when possible.`);
